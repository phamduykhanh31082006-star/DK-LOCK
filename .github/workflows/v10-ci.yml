name: DK LOCK V10 Application Locker Production Gate

on:
  push:
    branches: [ "v10-application-locker-refocus" ]
  workflow_dispatch:

concurrency:
  group: dk-lock-v10-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v10-production:
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      PYTHONUTF8: "1"
      V10_BASELINE_COMMIT: "c4d74a75069f3281db8f57a39b47236b5ce34cc1"
      V10_SCOPE_COMMIT: "ecdb85c5f98bae79c81ae210dd6c723f23c93b82"
      V10_DELTA_SHA256: "310d9a09901b492293d4d83064ede750f301502cb2afc12f8739db30d21fce8f"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify V10 ancestry and immutable V9 recipe
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:V10_BASELINE_COMMIT HEAD
          if ($LASTEXITCODE -ne 0) { throw "V10 branch is not based on exact V9 LOCKED commit $env:V10_BASELINE_COMMIT" }
          git merge-base --is-ancestor $env:V10_SCOPE_COMMIT HEAD
          if ($LASTEXITCODE -ne 0) { throw "Locked V10 scope commit $env:V10_SCOPE_COMMIT is not an ancestor of HEAD" }
          $critical = @(
            'ci/rehydrate-v8-for-v9.ps1',
            'ci/v9-patches/apply-v9-first-run-namespace-fix.ps1'
          )
          foreach ($path in $critical) {
            git diff --quiet $env:V10_BASELINE_COMMIT HEAD -- $path
            if ($LASTEXITCODE -ne 0) { throw "V9 rehydration recipe changed after the locked baseline: $path" }
          }
          $v9Parts = @(Get-ChildItem 'ci/v9rc.part*' | Sort-Object Name)
          if ($v9Parts.Count -ne 8) { throw "Expected 8 unchanged V9 source overlay parts, found $($v9Parts.Count)." }
          foreach ($part in $v9Parts) {
            git diff --quiet $env:V10_BASELINE_COMMIT HEAD -- $part.FullName
            if ($LASTEXITCODE -ne 0) { throw "V9 source overlay changed after the locked baseline: $($part.Name)" }
          }

      - name: Rehydrate exact locked V8 baseline
        shell: pwsh
        run: ./ci/rehydrate-v8-for-v9.ps1

      - name: Rehydrate exact locked V9 final source
        shell: pwsh
        run: |
          Move-Item 'ci-extract/DK_LOCK_V8' 'ci-extract/DK_LOCK_V10'
          $v9 = Get-ChildItem 'ci/v9rc.part*' | Sort-Object Name
          if ($v9.Count -ne 8) { throw "Expected 8 V9 source overlay parts, found $($v9.Count)." }
          $b64 = ($v9 | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('v9-source-overlay.tar.xz', [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash 'v9-source-overlay.tar.xz' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne 'b6ca1016e4825c8054802783932a2a19b5017572ae6bf240bdc681c1640de513') { throw "V9 source overlay SHA mismatch: $actual" }
          tar -xf 'v9-source-overlay.tar.xz' -C 'ci-extract/DK_LOCK_V10'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract V9 source overlay.' }
          ./ci/v9-patches/apply-v9-first-run-namespace-fix.ps1 -Root 'ci-extract/DK_LOCK_V10'
          $version = (Get-Content 'ci-extract/DK_LOCK_V10/VERSION' -Raw).Trim()
          if ($version -ne '9.0.0') { throw "Exact V9 baseline version mismatch: $version" }
          $status = Get-Content 'ci-extract/DK_LOCK_V10/V9_WORK_STATUS.md' -Raw
          if ($status -notmatch 'COMPLETED / RELEASED / LOCKED') { throw 'Exact V9 lock marker missing.' }

      - name: Verify exact canonical V10 delta
        shell: pwsh
        run: |
          $canonical = (Get-Content 'ci/v10rc.b64' -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($canonical)) { throw 'Canonical V10 delta carrier is empty.' }
          [IO.File]::WriteAllBytes('v10rcdelta.tar.xz', [Convert]::FromBase64String($canonical))
          $actual = (Get-FileHash 'v10rcdelta.tar.xz' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "V10_DELTA_SHA256=$actual"
          if ($actual -ne $env:V10_DELTA_SHA256) { throw "V10 delta SHA mismatch: $actual" }

      - name: Apply exact V10 candidate delta
        shell: pwsh
        run: |
          tar -xf 'v10rcdelta.tar.xz' -C 'ci-extract/DK_LOCK_V10'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract V10 delta.' }
          $deleteList = 'ci-extract/DK_LOCK_V10/.v10-delete-list.json'
          if (Test-Path $deleteList) {
            $deletes = Get-Content $deleteList -Raw | ConvertFrom-Json
            foreach ($relative in @($deletes)) {
              $target = Join-Path 'ci-extract/DK_LOCK_V10' $relative
              if (Test-Path $target) { Remove-Item $target -Recurse -Force }
            }
            Remove-Item $deleteList -Force
          }
          $version = (Get-Content 'ci-extract/DK_LOCK_V10/VERSION' -Raw).Trim()
          if ($version -ne '10.0.0-rc') { throw "V10 candidate version mismatch: $version" }
          $ipc = Get-Content 'ci-extract/DK_LOCK_V10/src/DKLock.Core/IPC/IpcContracts.cs' -Raw
          if ($ipc -notmatch 'Version\s*=\s*7') { throw 'V10 IPC protocol 7 marker missing.' }
          if (-not (Test-Path 'ci-extract/DK_LOCK_V10/scripts/test-v10.ps1')) { throw 'Mandatory V10 production gate entrypoint scripts/test-v10.ps1 is missing.' }

      - name: Restore exact V10 solution
        shell: pwsh
        working-directory: ci-extract/DK_LOCK_V10
        run: dotnet restore .\DKLock.sln

      - name: Build exact V10 whole solution warnings-as-errors
        shell: pwsh
        working-directory: ci-extract/DK_LOCK_V10
        run: dotnet build .\DKLock.sln -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Run complete V10 contract static runtime and release gates
        shell: pwsh
        working-directory: ci-extract/DK_LOCK_V10
        run: ./scripts/test-v10.ps1

      - name: Require exact V10 user installer and final report
        if: success()
        shell: pwsh
        run: |
          $zip = 'ci-extract/DK_LOCK_V10/artifacts/DK_LOCK_V10_RELEASE/DK_LOCK_V10_USER_INSTALLER.zip'
          if (-not (Test-Path $zip)) { throw "Production gate passed without required user installer: $zip" }
          $reportCandidates = @(
            'ci-extract/DK_LOCK_V10/report/V10_REPORT.md',
            'ci-extract/DK_LOCK_V10/artifacts/DK_LOCK_V10_RELEASE/V10_REPORT.md'
          )
          $report = $reportCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $report) { throw 'Production gate passed without a V10 final report.' }
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "V10_USER_INSTALLER_SHA256=$zipHash"

      - name: Upload V10 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-runtime-evidence
          path: |
            ci-extract/DK_LOCK_V10/report/runtime/V10_*.txt
            ci-extract/DK_LOCK_V10/report/runtime/V10_*.png
            ci-extract/DK_LOCK_V10/report/runtime/V10_*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload exact V10 end-user release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v10-final-end-user-release
          path: ci-extract/DK_LOCK_V10/artifacts/DK_LOCK_V10_RELEASE
          retention-days: 30

      - name: Upload exact V10 user installer ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v10-final-user-installer
          path: ci-extract/DK_LOCK_V10/artifacts/DK_LOCK_V10_RELEASE/DK_LOCK_V10_USER_INSTALLER.zip
          if-no-files-found: error
          retention-days: 30

      - name: Clean exact tested V10 source
        if: success()
        shell: pwsh
        run: |
          if (Test-Path 'ci-extract/DK_LOCK_V10/artifacts') { Remove-Item 'ci-extract/DK_LOCK_V10/artifacts' -Recurse -Force }
          if (Test-Path 'ci-extract/DK_LOCK_V10/tools/DKLock.Setup/Payload/dklock-payload.zip') { Remove-Item 'ci-extract/DK_LOCK_V10/tools/DKLock.Setup/Payload/dklock-payload.zip' -Force }
          Get-ChildItem 'ci-extract/DK_LOCK_V10' -Directory -Recurse | Where-Object { $_.Name -in @('bin','obj','__pycache__') } | Sort-Object FullName -Descending | Remove-Item -Recurse -Force

      - name: Upload exact tested V10 source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v10-final-tested-source
          path: ci-extract/DK_LOCK_V10
          retention-days: 30
