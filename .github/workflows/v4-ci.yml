name: DK LOCK V4 Folder and Secure Documents Release Gate

on:
  push:
    branches: [ "v4-folder-documents" ]
  workflow_dispatch:

jobs:
  v4-release-gate:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Rehydrate final tested V3 baseline
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'ci/v3src.part*' | Sort-Object Name
          if ($parts.Count -ne 12) { throw "Expected 12 V3 snapshot parts, found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('v3src.tar.xz', [Convert]::FromBase64String($b64))
          $expected = '905b7dec760f149f8f8e91fd6db5dd17abd3cc78ab95920cded5ee844cab2a9e'
          $actual = (Get-FileHash 'v3src.tar.xz' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "V3 baseline SHA256 mismatch: $actual" }
          New-Item -ItemType Directory -Path 'ci-extract' -Force | Out-Null
          tar -xf 'v3src.tar.xz' -C 'ci-extract'
          Copy-Item 'ci/test-v3-fixed.ps1' 'ci-extract/DK_LOCK_V3/scripts/test-v3.ps1' -Force
          Copy-Item -Path 'ci/overrides/*' -Destination 'ci-extract/DK_LOCK_V3' -Recurse -Force
          Move-Item 'ci-extract/DK_LOCK_V3' 'ci-extract/DK_LOCK_V4'

      - name: Apply locked V4 delta
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'ci/v4delta.part*' | Sort-Object Name
          if ($parts.Count -ne 7) { throw "Expected 7 V4 delta parts, found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('v4delta.tar.xz', [Convert]::FromBase64String($b64))
          $expected = 'd44e61b34ce7e0180ba0bfbc7fd7d90d838b401b127116ad9d93d00fb5caba29'
          $actual = (Get-FileHash 'v4delta.tar.xz' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "V4 delta SHA256: $actual"
          if ($actual -ne $expected) { throw "V4 delta SHA256 mismatch: $actual" }
          tar -xf 'v4delta.tar.xz' -C 'ci-extract/DK_LOCK_V4'
          if (Test-Path 'ci/v4-overrides') {
            Copy-Item -Path 'ci/v4-overrides/*' -Destination 'ci-extract/DK_LOCK_V4' -Recurse -Force
          }
          if (-not (Test-Path 'ci-extract/DK_LOCK_V4/DKLock.sln')) { throw 'V4 candidate reconstruction failed.' }

      - name: Run all 16 V4 release gates
        shell: pwsh
        working-directory: ci-extract/DK_LOCK_V4
        run: ./scripts/test-v4.ps1

      - name: Upload V4 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-runtime-evidence
          path: |
            ci-extract/DK_LOCK_V4/report/runtime/V3_WPF_SMOKE_ONLINE.txt
            ci-extract/DK_LOCK_V4/report/runtime/V3_WPF_SMOKE_ONLINE.png
            ci-extract/DK_LOCK_V4/report/runtime/V3_WPF_SMOKE_OFFLINE.txt
            ci-extract/DK_LOCK_V4/report/runtime/V3_WPF_SMOKE_OFFLINE.png
            ci-extract/DK_LOCK_V4/report/runtime/V3_APPLICATIONS_UI.txt
            ci-extract/DK_LOCK_V4/report/runtime/V3_APPLICATIONS_UI.png
            ci-extract/DK_LOCK_V4/report/runtime/V3_UNLOCK_UI.png
            ci-extract/DK_LOCK_V4/report/runtime/V4_CONTENT_UI.txt
            ci-extract/DK_LOCK_V4/report/runtime/V4_FOLDERS_UI.png
            ci-extract/DK_LOCK_V4/report/runtime/V4_VAULT_UI.png
            ci-extract/DK_LOCK_V4/report/runtime/V4_CREDENTIAL_UI.png
          if-no-files-found: warn
          retention-days: 14

      - name: Clean build intermediates after successful gate
        if: success()
        shell: pwsh
        run: |
          Get-ChildItem 'ci-extract/DK_LOCK_V4' -Directory -Recurse | Where-Object { $_.Name -in @('bin','obj') } | Sort-Object FullName -Descending | Remove-Item -Recurse -Force

      - name: Upload clean tested V4 candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v4-tested-candidate
          path: ci-extract/DK_LOCK_V4
          retention-days: 14
