name: DK LOCK V2 Core Release Gate

on:
  push:
    branches: [ "v2-core" ]
  workflow_dispatch:

jobs:
  v2-release-gate:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Rehydrate verified V2 source snapshot
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'ci/v2lean.part*' | Sort-Object Name
          if ($parts.Count -ne 6) { throw "Expected 6 V2 source parts, found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('v2src.tar.xz', [Convert]::FromBase64String($b64))
          $expected = '378968e29cf39eaa2c37cd5b2d2c25ed1c202eaff3526e3efd2ee080335ed0fd'
          $actual = (Get-FileHash 'v2src.tar.xz' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "V2 source SHA256: $actual"
          if ($actual -ne $expected) { throw 'V2 source archive SHA256 mismatch.' }
          New-Item -ItemType Directory -Path 'ci-work' -Force | Out-Null
          tar -xf 'v2src.tar.xz' -C 'ci-work'
          if (-not (Test-Path 'ci-work/DKLock.sln')) { throw 'DKLock.sln was not extracted.' }
          if (-not (Test-Path 'ci-work/scripts/test-v2.ps1')) { throw 'V2 release gate script was not extracted.' }

      - name: Run complete V2 release gate
        shell: pwsh
        working-directory: ci-work
        run: ./scripts/test-v2.ps1

      - name: Upload V2 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-runtime-evidence
          path: |
            ci-work/report/runtime/V2_WPF_SMOKE_ONLINE.txt
            ci-work/report/runtime/V2_WPF_SMOKE_ONLINE.png
            ci-work/report/runtime/V2_WPF_SMOKE_OFFLINE.txt
            ci-work/report/runtime/V2_WPF_SMOKE_OFFLINE.png
          if-no-files-found: warn
          retention-days: 14
